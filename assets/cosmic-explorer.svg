<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Cosmic Explorer Catalog</title>
  <desc id="description">57,380 celestial objects in six CSV files, the data layer behind Cosmic Atlas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0F12"/>
      <stop offset=".58" stop-color="#121418"/>
      <stop offset="1" stop-color="#19161F"/>
    </linearGradient>
    <linearGradient id="ring" x1="700" y1="50" x2="1120" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B493FF" stop-opacity=".05"/>
      <stop offset=".48" stop-color="#B493FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#CBB2FF" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(170 130 -135 176 930 214)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B493FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#B493FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#CBB2FF" stroke-opacity=".045"/>
    </pattern>
    <filter id="softGlow" x="740" y="40" width="380" height="350" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="url(#background)" d="M0 0h1200v420H0z"/>
    <path fill="url(#grid)" d="M0 0h1200v420H0z"/>
    <path fill="url(#glow)" d="M0 0h1200v420H0z"/>

    <path d="M0 339c171-42 288-45 423-11 135 33 218 31 353-20 137-52 257-68 424-35" stroke="#B493FF" stroke-opacity=".1"/>
    <path d="M0 354c182-40 284-34 416-3 149 35 238 29 363-19 147-56 261-67 421-44" stroke="#B493FF" stroke-opacity=".06"/>

    <g fill="#E5DAFF">
      <circle cx="640" cy="66" r="1.5" opacity=".78"/>
      <circle cx="742" cy="118" r="1" opacity=".6"/>
      <circle cx="1108" cy="86" r="1.6" opacity=".66"/>
      <circle cx="1162" cy="272" r="1.3" opacity=".72"/>
      <circle cx="1046" cy="352" r="1" opacity=".56"/>
      <circle cx="700" cy="326" r="1.4" opacity=".68"/>
      <circle cx="672" cy="172" r="1" opacity=".58"/>
      <circle cx="1112" cy="192" r="1" opacity=".66"/>
      <circle cx="968" cy="58" r="1.2" opacity=".5"/>
      <circle cx="806" cy="392" r="1.1" opacity=".5"/>
    </g>

    <text x="78" y="111" fill="#CBB2FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.8">ASTRONOMICAL CATALOG</text>
    <text x="74" y="187" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="650" letter-spacing="-2.6">Cosmic Explorer</text>
    <path d="M80 211h46" stroke="#B493FF" stroke-width="2"/>
    <text x="80" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="20">57,380 celestial objects, ready to photograph.</text>
    <text x="80" y="291" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Nebulae &#183; Galaxies &#183; Clusters &#183; Stars &#183; Extrema</text>
    <text x="80" y="358" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.1">SIX CSV FILES  /  ONE SOURCE OF TRUTH</text>

    <circle cx="930" cy="212" r="150" fill="#B493FF" fill-opacity=".1" filter="url(#softGlow)"/>
    <circle cx="930" cy="212" r="142" stroke="url(#ring)" stroke-width="1.5"/>
    <circle cx="930" cy="212" r="104" stroke="#CBB2FF" stroke-opacity=".16"/>
    <circle cx="930" cy="212" r="64" stroke="#CBB2FF" stroke-opacity=".1"/>

    <g stroke="#CBB2FF" stroke-opacity=".45" stroke-width="1.2">
      <path d="M846 168 918 132 1004 176 1022 246 946 288 868 246Z"/>
      <path d="M918 132V64M1022 246l58 26M846 168L784 138M946 288v56"/>
    </g>
    <g fill="#CBB2FF">
      <circle cx="846" cy="168" r="4.5"/>
      <circle cx="918" cy="132" r="6"/>
      <circle cx="1004" cy="176" r="4"/>
      <circle cx="1022" cy="246" r="5"/>
      <circle cx="946" cy="288" r="4.5"/>
      <circle cx="868" cy="246" r="3.5"/>
      <circle cx="918" cy="64" r="3"/>
      <circle cx="1080" cy="272" r="3"/>
      <circle cx="784" cy="138" r="3"/>
      <circle cx="946" cy="344" r="2.6"/>
    </g>
    <g stroke="#E5DAFF" stroke-opacity=".75" stroke-width="1.2">
      <path d="M918 120v24m-12-12h24"/>
      <path d="M1022 236v20m-10-10h20"/>
      <path d="M846 158v20m-10-10h20"/>
    </g>

    <g fill="#CBB2FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing=".8">
      <text x="946" y="120">M 31</text>
      <text x="1048" y="286">NGC 7000</text>
      <text x="742" y="126">HIP 32349</text>
      <text x="884" y="392">Abell 1656</text>
    </g>
  </g>
</svg>
